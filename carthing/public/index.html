<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TV Thing</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="frame" class="fill"><video id="video" muted playsinline autoplay></video></div>
  <canvas id="static" width="160" height="96"></canvas>
  <div class="scanlines"></div>
  <div id="bug" class="bug"><b></b><span></span></div>
  <div id="guide" class="guide" aria-hidden="true"><header>Channels</header><ol></ol><footer>Turn to browse · press to watch · 1–4 to save</footer></div>
  <div id="card" class="card"><strong></strong><p></p></div>
  <div id="toast" class="toast"></div>
  <div id="volume" class="volume"><span>VOLUME</span><div></div><b></b></div>
  <div id="muted" class="muted" aria-label="Muted"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke-width="2.4" stroke-linecap="round"/></svg></div>
  <script src="app.js"></script>
</body>
</html>
